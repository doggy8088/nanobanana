name: Auto Release

on:
  push:
    branches:
      - 4k
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.42'

      - name: Install root dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: cd mcp-server && npm ci

      - name: Run build
        run: npm run build

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Set version variable
        run: |
          if [ "${{ steps.check_tag.outputs.exists }}" == "true" ]; then
            FINAL_VERSION=$NEW_VERSION
          else
            FINAL_VERSION=${{ steps.get_version.outputs.version }}
          fi
          echo "FINAL_VERSION=$FINAL_VERSION" >> $GITHUB_ENV

      - name: Update extension version
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"${FINAL_VERSION}\"/" gemini-extension.json

      - name: Update .gemini-extension-install.json
        run: |
          jq --arg tag "v${FINAL_VERSION}-4k" '.releaseTag = $tag' .gemini-extension-install.json > tmp.json && mv tmp.json .gemini-extension-install.json
          cat .gemini-extension-install.json

      - name: Create TAR archive
        run: tar -cvzf ../nanobanana-release.tar.gz --exclude='.git' --exclude='.github' --exclude='./node_modules' . && mv ../nanobanana-release.tar.gz .

      - name: Commit version bump
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json gemini-extension.json .gemini-extension-install.json
          git commit -m "chore: bump version to ${FINAL_VERSION}"
          git push

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.FINAL_VERSION }}-4k
          name: Release v${{ env.FINAL_VERSION }}-4k
          generateReleaseNotes: true
          draft: false
          prerelease: false
          artifacts: nanobanana-release.tar.gz
          allowUpdates: true
          removeArtifacts: true
