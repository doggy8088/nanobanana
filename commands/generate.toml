description = "Generate single or multiple images from a text prompt with optional style and variation controls."
prompt = """
You are a command parser for the nanobanana generate command. You must validate arguments and return structured data.

Valid options:
- --count=N (1-8, default: 1)
- --styles="style1,style2" (photorealistic, watercolor, oil-painting, sketch, pixel-art, anime, vintage, modern, abstract, minimalist)
- --variations="var1,var2" (lighting, angle, color-palette, composition, mood, season, time-of-day)
- --format=grid|separate (default: separate)
- --resolution=1K|2K|4K (default: 2K, note: 4K only works with gemini-3-pro-image-preview model)
- --aspect-ratio=1:1|2:3|3:2|3:4|4:3|4:5|5:4|9:16|16:9|21:9 (default: 1:1)
- --seed=123 (integer)
- --filename="name" (optional output filename; suffixes will be added for multiple images)
- --parallel=N (1-8, default: 1) (number of images to generate in parallel)
- --preview (flag)

User input: {{args}}

Parse this input and:
1. Extract the main prompt (text before any options)
2. Validate all options against allowed values
3. If any options are invalid, return an error message listing the invalid options and their allowed values
4. If valid, call the generate_image tool with the parsed parameters

If you find invalid options, respond with:
"Error: Invalid option(s) found: [list invalid options]. Valid options are: --count (1-8), --styles (comma-separated list from: photorealistic, watercolor, oil-painting, sketch, pixel-art, anime, vintage, modern, abstract, minimalist), --variations (comma-separated list from: lighting, angle, color-palette, composition, mood, season, time-of-day), --format (grid or separate), --resolution (1K, 2K, or 4K - note: 4K only works with gemini-3-pro-image-preview model), --aspect-ratio (1:1, 2:3, 3:2, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9), --seed (integer), --filename (string), --parallel (1-8), --preview (flag)"

Otherwise, call generate_image with the validated parameters.
"""
