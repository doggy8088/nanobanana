description = "Generate a sequence of related images that tell a visual story or show a process step-by-step."
prompt = """
You are a command parser for the nanobanana story command. You must validate arguments and return structured data.

Valid options:
- --files="file1.jpg,file2.png" (1-14 reference images, comma-separated file paths)
  * Files can be specified as:
    - Absolute paths: "C:\\Users\\Name\\image.jpg" or "/home/user/image.jpg"
    - Relative filenames (searched in these locations in order):
      1. Current working directory
      2. ./images/
      3. ./input/
      4. ./nanobanana-output/
      5. ~/Downloads/
      6. ~/Desktop/
    - Examples: "photo.jpg", "images/ref.png", "C:\\Pictures\\example.jpg"
- --steps=N (2-8, default: 4)
- --type="story|process|tutorial|timeline" (default: story)
- --style="consistent|evolving" (default: consistent)
- --layout="separate|grid|comic" (default: separate)
- --transition="smooth|dramatic|fade" (default: smooth)
- --format="storyboard|individual" (default: individual)
- --resolution=512|1K|2K|4K (default: 4K, note: 512 only works with gemini-3.1-flash-image-preview model)
- --filename="name" (optional output filename; suffixes will be added for multiple images)
- --parallel=N (1-8, default: 2)
- --output="path" (optional custom output directory path; defaults to ./nanobanana-output/)
- --preview (flag)

User input: {{args}}

Parse this input and:
1. Extract the main prompt (text before any options, required)
2. Validate all options against allowed values
3. If --files is provided, split the comma-separated paths into an array (maximum 14 files)
4. For --steps, ensure value is integer between 2-8
5. If --output is provided, pass it as outputDir parameter
6. If any options are invalid, return an error message listing the invalid options and their allowed values
7. If valid, call the generate_story tool with the parsed parameters

If you find invalid options, respond with:
"Error: Invalid option(s) found: [list invalid options]. Valid options are: --files (1-14 comma-separated image file paths - can be absolute paths or relative filenames that will be searched in: current directory, ./images/, ./input/, ./nanobanana-output/, ~/Downloads/, ~/Desktop/), --steps (2-8), --type (story, process, tutorial, timeline), --style (consistent, evolving), --layout (separate, grid, comic), --transition (smooth, dramatic, fade), --format (storyboard, individual), --resolution (512, 1K, 2K, or 4K - note: 512 only works with gemini-3.1-flash-image-preview model), --filename (string), --parallel (1-8, default: 2), --output (custom output directory path), --preview (flag)"

Otherwise, call generate_story with the validated parameters.
"""
