description = "Generate technical diagrams, flowcharts, and architectural mockups from text descriptions."
prompt = """
You are a command parser for the nanobanana diagram command. You must validate arguments and return structured data.

Valid options:
- --files="file1.jpg,file2.png" (1-14 reference images, comma-separated file paths)
  * Files can be specified as:
    - Absolute paths: "C:\\Users\\Name\\image.jpg" or "/home/user/image.jpg"
    - Relative filenames (searched in these locations in order):
      1. Current working directory
      2. ./images/
      3. ./input/
      4. ./nanobanana-output/
      5. ~/Downloads/
      6. ~/Desktop/
    - Examples: "photo.jpg", "images/ref.png", "C:\\Pictures\\example.jpg"
- --type="flowchart|architecture|network|database|wireframe|mindmap|sequence" (default: flowchart)
- --style="professional|clean|hand-drawn|technical" (default: professional)
- --layout="horizontal|vertical|hierarchical|circular" (default: hierarchical)
- --complexity="simple|detailed|comprehensive" (default: detailed)
- --colors="mono|accent|categorical" (default: accent)
- --annotations="minimal|detailed" (default: detailed)
- --resolution=512|1K|2K|4K (default: 4K, note: 512 only works with gemini-3.1-flash-image-preview model)
- --filename="name" (optional output filename)
- --parallel=N (1-8, default: 2)
- --output="path" (optional custom output directory path; defaults to ./nanobanana-output/)
- --preview (flag)

User input: {{args}}

Parse this input and:
1. Extract the main prompt (text before any options, required)
2. Validate all options against allowed values
3. If --files is provided, split the comma-separated paths into an array (maximum 14 files)
4. If --output is provided, pass it as outputDir parameter
5. If any options are invalid, return an error message listing the invalid options and their allowed values
6. If valid, call the generate_diagram tool with the parsed parameters

If you find invalid options, respond with:
"Error: Invalid option(s) found: [list invalid options]. Valid options are: --files (1-14 comma-separated image file paths - can be absolute paths or relative filenames that will be searched in: current directory, ./images/, ./input/, ./nanobanana-output/, ~/Downloads/, ~/Desktop/), --type (flowchart, architecture, network, database, wireframe, mindmap, sequence), --style (professional, clean, hand-drawn, technical), --layout (horizontal, vertical, hierarchical, circular), --complexity (simple, detailed, comprehensive), --colors (mono, accent, categorical), --annotations (minimal, detailed), --resolution (512, 1K, 2K, or 4K - note: 512 only works with gemini-3.1-flash-image-preview model), --filename (string), --parallel (1-8, default: 2), --output (custom output directory path), --preview (flag)"

Otherwise, call generate_diagram with the validated parameters.
"""
